<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Budget v2 admin</title><style>body{font:15px system-ui,sans-serif;margin:0;background:#111416;color:#f1f0eb}.wrap{max-width:1150px;margin:36px auto;padding:0 20px}h1{font-weight:500}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.card,section{background:#191d20;border:1px solid #30373b;padding:16px;margin:14px 0}.label{color:#929b9f;font-size:12px}.num{font-size:26px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #30373b;vertical-align:top}pre{white-space:pre-wrap;word-break:break-word}.scroll{overflow:auto}button{background:#d17a4b;color:#fff;border:0;padding:8px;cursor:pointer}.error{color:#dc806f}input{padding:10px;width:min(500px,80%);background:#191d20;color:#fff;border:1px solid #555}</style></head><body><main class="wrap"><h1>Budget admin</h1><p id="status">Checking admin access…</p><div id="dashboard" hidden><div class="cards" id="stats"></div><section><h2>Users</h2><div class="scroll"><table><thead><tr><th>ID</th><th>Email</th><th>Role</th><th>Joined</th><th>Last seen</th><th>Logins</th><th>Entries</th><th>Role action</th></tr></thead><tbody id="users"></tbody></table></div></section><section><h2>Bug reports</h2><div id="reports"></div></section></div></main><script>
const token=localStorage.getItem('ledgerBudgetToken');const statusEl=document.getElementById('status');async function api(path,options={}){const r=await fetch('/api'+path,{...options,headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`,...options.headers}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);return d}const date=v=>v?new Date(v).toLocaleString():'Never';async function load(){if(!token)throw Error('Sign in to the Budget app first, then open this page.');const d=await api('/admin/overview');document.getElementById('dashboard').hidden=false;statusEl.textContent='Admin access verified';document.getElementById('stats').innerHTML=Object.entries({'Users':d.stats.users,'Entries':d.stats.entries,'Bug reports':d.stats.reports,'Signups today':d.stats.signups_today,'Active in 7 days':d.stats.active_7d}).map(([k,v])=>`<div class="card"><div class="label">${k}</div><div class="num">${v}</div></div>`).join('');document.getElementById('users').innerHTML=d.users.map(u=>`<tr><td>${u.id}</td><td>${u.email}</td><td>${u.role}</td><td>${date(u.created_at)}</td><td>${date(u.last_seen_at)}</td><td>${u.login_count}</td><td>${u.entry_count}</td><td>${u.role==='admin'?'Admin':`<button data-admin="${u.id}">Make admin</button>`}</td></tr>`).join('');document.getElementById('reports').innerHTML=d.reports.length?d.reports.map(r=>`<article class="card"><div class="label">#${r.id} · ${date(r.created_at)} · ${r.email||'account removed'} · ${r.page} · ${r.app_version}</div><pre>${String(r.message).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</pre></article>`).join(''):'No reports yet.'}document.addEventListener('click',async e=>{const b=e.target.closest('[data-admin]');if(!b)return;if(!confirm('Promote this account to admin?'))return;await api(`/admin/users/${b.dataset.admin}/role`,{method:'POST',body:JSON.stringify({role:'admin'})});await load()});load().catch(e=>{statusEl.textContent=e.message;statusEl.className='error'});
</script></body></html>
